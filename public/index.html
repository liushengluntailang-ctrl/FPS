<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CYBER STRIKE 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #00ffcc;
    }
    #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
    #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

    /* スナイパースコープUI */
    #sniper-scope {
      display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      border-radius: 50%; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.95);
      border: 2px solid #ff0055; pointer-events: none;
    }

    /* HUD */
    #hud { position: absolute; bottom: 20px; left: 20px; color: #fff; font-size: 20px; pointer-events: none; }
    #weapon-hud { position: absolute; bottom: 20px; right: 20px; color: #00ffcc; font-size: 22px; font-weight: bold; pointer-events: none; text-align: right; }
    #kill-log { position: absolute; top: 20px; right: 20px; color: #ffeb3b; font-size: 14px; pointer-events: none; }
    #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff0055; font-size: 28px; font-weight: bold; display: none; pointer-events: none; }

    /* スタート画面 */
    #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; }
    input { padding: 10px; font-size: 18px; border-radius: 5px; border: 2px solid #00ffcc; background: #111; color: #fff; margin-bottom: 10px; text-align: center; }
    button { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #00ffcc; border: none; border-radius: 5px; cursor: pointer; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="sniper-scope"></div>
<div id="hit-marker">✕</div>

<div id="hud">
  <div>❤️ HP: <span id="hp-val">100</span></div>
  <div>🏆 KILLS: <span id="kills-val">0</span></div>
</div>

<div id="weapon-hud">
  <div id="cur-weapon">1: ASSAULT RIFLE</div>
  <div style="font-size: 13px; color: #aaa;">[1-5] 切替 / 右クリック: ADS</div>
</div>

<div id="kill-log"></div>

<div id="blocker">
  <h1 style="color: #00ffcc; letter-spacing: 4px;">⚔️ CYBER STRIKE 3D</h1>
  <p>WASD: 移動 | SPACE: ジャンプ | SHIFT: ダッシュ | 1~5: 武器切替</p>
  <input type="text" id="name-input" placeholder="名前を入力..." maxlength="10">
  <button id="start-btn">参戦する (クリック)</button>
</div>

<script>
  const socket = io();

  // ================= 武器データ =================
  const WEAPONS = {
    1: { name: 'ASSAULT RIFLE', damage: 25, delay: 130, range: 100, auto: true, count: 1, spread: 0.02 },
    2: { name: 'SHOTGUN', damage: 16, delay: 750, range: 40, auto: false, count: 6, spread: 0.08 },
    3: { name: 'SNIPER RIFLE', damage: 100, delay: 1100, range: 250, auto: false, count: 1, spread: 0.001, scope: true },
    4: { name: 'SMG', damage: 15, delay: 75, range: 60, auto: true, count: 1, spread: 0.045 },
    5: { name: 'KATANA', damage: 95, delay: 400, range: 4.5, auto: false, count: 1, spread: 0, melee: true }
  };

  let currentWeaponIndex = 1;
  let lastShotTime = 0;
  let isAiming = false;
  let isShooting = false;
  let myId = null;

  // ================= Three.js 基本設定 =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0c14);
  scene.fog = new THREE.Fog(0x0a0c14, 20, 120);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // ライティング
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
  dirLight.position.set(20, 40, 20);
  scene.add(dirLight);

  // ================= 立体マップの構築 =================
  const obstacles = [];

  // 床
  const floorGeo = new THREE.PlaneGeometry(100, 100);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // オブジェクト生成ヘルパー
  function createBox(x, y, z, w, h, d, color = 0x2e3440) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color })
    );
    mesh.position.set(x, y + h / 2, z);
    scene.add(mesh);
    obstacles.push(mesh);
    return mesh;
  }

  // 中央の高台タワー（スナイパー用）
  createBox(0, 0, 0, 12, 6, 12, 0x3b4252);
  // スロープ代わりの段差
  createBox(0, 0, 9, 6, 3, 6, 0x434c5e);
  createBox(0, 0, -9, 6, 3, 6, 0x434c5e);

  // 遮蔽物コンテナ・柱（立体的な駆け引き用）
  createBox(15, 0, 15, 4, 4, 8, 0x5e81ac);
  createBox(-15, 0, -15, 8, 4, 4, 0x5e81ac);
  createBox(-18, 0, 12, 4, 7, 4, 0x88c0d0);
  createBox(18, 0, -12, 4, 7, 4, 0x88c0d0);

  // ================= FPS操作・移動 =================
  const controls = new THREE.PointerLockControls(camera, document.body);
  const blocker = document.getElementById('blocker');

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = document.getElementById('name-input').value;
    socket.emit('join', name);
    controls.lock();
  });

  controls.addEventListener('lock', () => blocker.style.display = 'none');
  controls.addEventListener('unlock', () => blocker.style.display = 'flex');

  const move = { forward: false, backward: false, left: false, right: false, jump: false, sprint: false };
  let velocity = new THREE.Vector3();
  let direction = new THREE.Vector3();
  let canJump = false;

  window.addEventListener('keydown', (e) => {
    if (['1','2','3','4','5'].includes(e.key)) {
      currentWeaponIndex = parseInt(e.key);
      document.getElementById('cur-weapon').innerText = `${currentWeaponIndex}: ${WEAPONS[currentWeaponIndex].name}`;
      if (isAiming) toggleADS(false);
    }
    if (e.code === 'KeyW') move.forward = true;
    if (e.code === 'KeyS') move.backward = true;
    if (e.code === 'KeyA') move.left = true;
    if (e.code === 'KeyD') move.right = true;
    if (e.code === 'Space' && canJump) { velocity.y += 12; canJump = false; }
    if (e.code === 'ShiftLeft') move.sprint = true;
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') move.forward = false;
    if (e.code === 'KeyS') move.backward = false;
    if (e.code === 'KeyA') move.left = false;
    if (e.code === 'KeyD') move.right = false;
    if (e.code === 'ShiftLeft') move.sprint = false;
  });

  // 射撃とADS（右クリック）
  window.addEventListener('mousedown', (e) => {
    if (!controls.isLocked) return;
    if (e.button === 0) { isShooting = true; shoot(); }
    if (e.button === 2) toggleADS(true);
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) isShooting = false;
    if (e.button === 2) toggleADS(false);
  });
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  function toggleADS(aim) {
    isAiming = aim;
    const w = WEAPONS[currentWeaponIndex];
    if (w.scope) {
      document.getElementById('sniper-scope').style.display = aim ? 'block' : 'none';
      camera.fov = aim ? 20 : 75; // スナイパー大ズーム
    } else {
      camera.fov = aim ? 50 : 75; // 通常ADS
    }
    camera.updateProjectionMatrix();
  }

  // ================= プレイヤーモデル管理 =================
  const otherPlayers = {};
  const hitTargets = []; // Raycast判定対象

  function createPlayerMesh(p) {
    const group = new THREE.Group();
    // 胴体
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.5), new THREE.MeshStandardMaterial({ color: p.color }));
    body.position.y = 0.9;
    group.add(body);
    // 頭
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    head.position.y = 1.85;
    group.add(head);

    group.position.set(p.x, p.y, p.z);
    scene.add(group);

    // 当たり判定用にuserData付与
    body.userData = { playerId: p.id };
    head.userData = { playerId: p.id, isHeadshot: true };
    hitTargets.push(body, head);

    return group;
  }

  // ================= 射撃 / 刀 攻撃システム =================
  const raycaster = new THREE.Raycaster();

  function shoot() {
    const now = Date.now();
    const w = WEAPONS[currentWeaponIndex];
    if (now - lastShotTime < w.delay) return;
    lastShotTime = now;

    // 刀（近接）の演出
    if (w.melee) {
      camera.rotation.z += 0.1;
      setTimeout(() => camera.rotation.z -= 0.1, 80);
    }

    // 弾数分（散弾なら複数）レイを飛ばす
    for (let i = 0; i < w.count; i++) {
      const spreadX = (Math.random() - 0.5) * (isAiming ? w.spread * 0.3 : w.spread);
      const spreadY = (Math.random() - 0.5) * (isAiming ? w.spread * 0.3 : w.spread);

      raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
      raycaster.far = w.range;

      const intersects = raycaster.intersectObjects(hitTargets);
      if (intersects.length > 0) {
        const hitObj = intersects[0].object;
        const targetId = hitObj.userData.playerId;
        const damage = hitObj.userData.isHeadshot ? w.damage * 1.5 : w.damage;

        socket.emit('hit', { targetId, damage, weapon: w.name });
      }
    }

    // フルオート連射
    if (w.auto && isShooting) {
      setTimeout(shoot, w.delay);
    }
  }

  // ヒットマーカー
  socket.on('hitSuccess', () => {
    const hm = document.getElementById('hit-marker');
    hm.style.display = 'block';
    setTimeout(() => hm.style.display = 'none', 100);
  });

  // ================= ソケット通信 =================
  socket.on('init', (data) => {
    myId = data.id;
    for (const id in data.players) {
      if (id !== myId) otherPlayers[id] = createPlayerMesh(data.players[id]);
    }
  });

  socket.on('playerJoined', (p) => {
    otherPlayers[p.id] = createPlayerMesh(p);
  });

  socket.on('playerMoved', (p) => {
    if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
      otherPlayers[p.id].rotation.y = p.rotY;
    }
  });

  socket.on('playerLeft', (id) => {
    if (otherPlayers[id]) {
      scene.remove(otherPlayers[id]);
      delete otherPlayers[id];
    }
  });

  socket.on('playerDamaged', (data) => {
    if (data.id === myId) document.getElementById('hp-val').innerText = data.hp;
  });

  socket.on('killLog', (data) => {
    const log = document.getElementById('kill-log');
    const entry = document.createElement('div');
    entry.innerText = `💥 [${data.weapon}] ${data.killer} ➔ ${data.victim}`;
    log.appendChild(entry);
    setTimeout(() => entry.remove(), 4000);
  });

  socket.on('playerRespawn', (p) => {
    if (p.id === myId) {
      camera.position.set(p.x, p.y + 1.6, p.z);
      document.getElementById('hp-val').innerText = '100';
    } else if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
    }
  });

  // ================= メインループ =================
  let prevTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    if (controls.isLocked) {
      // 速度減速
      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;
      velocity.y -= 30.0 * delta; // 重力

      direction.z = Number(move.forward) - Number(move.backward);
      direction.x = Number(move.right) - Number(move.left);
      direction.normalize();

      const speed = move.sprint ? 70.0 : 40.0;
      if (move.forward || move.backward) velocity.z -= direction.z * speed * delta;
      if (move.left || move.right) velocity.x -= direction.x * speed * delta;

      controls.moveRight(-velocity.x * delta);
      controls.moveForward(-velocity.z * delta);
      camera.position.y += velocity.y * delta;

      // 床・高台の簡易着地判定
      if (camera.position.y < 1.6) {
        velocity.y = 0;
        camera.position.y = 1.6;
        canJump = true;
      }

      // サーバーへ位置送信
      socket.emit('playerMove', {
        x: camera.position.x,
        y: camera.position.y - 1.6,
        z: camera.position.z,
        rotY: camera.rotation.y
      });
    }

    prevTime = time;
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
