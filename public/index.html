<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CYBER STRIKE 3D - ULTIMATE PERFECT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }

    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 4px #00ffcc; }
    #crosshair::before { top: 6px; left: -10px; width: 34px; height: 2px; }
    #crosshair::after { top: -10px; left: 6px; width: 2px; height: 34px; }

    #sniper-scope {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 20;
    }
    .scope-circle {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(75vh, 75vw); height: min(75vh, 75vw);
      border-radius: 50%; border: 3px solid #ff0055;
      box-shadow: 0 0 0 2000px rgba(5, 5, 10, 0.96);
    }
    .scope-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255,0,85,0.7); }
    .scope-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255,0,85,0.7); }
    .scope-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff0055; transform: translate(-50%, -50%); border-radius: 50%; }

    #hit-marker {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ff0055; font-size: 36px; font-weight: bold; display: none; pointer-events: none; z-index: 15;
    }

    #kill-banner {
      position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(255, 0, 85, 0.85); color: #fff; padding: 12px 35px;
      font-size: 26px; font-weight: 900; letter-spacing: 2px; border-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.8); opacity: 0; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none; z-index: 30;
    }
    #kill-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }

    #hud { position: absolute; bottom: 25px; left: 25px; color: #fff; font-size: 22px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px #000; z-index: 10; }
    #weapon-hud { position: absolute; bottom: 25px; right: 25px; color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; text-align: right; text-shadow: 2px 2px 4px #000; z-index: 10; }
    #ammo-hud { font-size: 38px; color: #fff; }
    #kill-log { position: absolute; top: 20px; right: 20px; color: #ffeb3b; font-size: 15px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 3px #000; z-index: 10; }

    #blocker {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 25, 0.92); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100;
    }
    input {
      padding: 12px 20px; font-size: 20px; border-radius: 8px; border: 2px solid #00ffcc;
      background: #111; color: #fff; margin-bottom: 15px; text-align: center; outline: none;
    }
    button {
      padding: 14px 40px; font-size: 22px; font-weight: bold; background: #00ffcc;
      border: none; border-radius: 8px; cursor: pointer; color: #000; transition: transform 0.1s;
    }
    button:hover { transform: scale(1.05); background: #33ffd6; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="sniper-scope">
  <div class="scope-circle">
    <div class="scope-line-h"></div>
    <div class="scope-line-v"></div>
    <div class="scope-dot"></div>
  </div>
</div>
<div id="hit-marker">✕</div>
<div id="kill-banner">🎯 ENEMY ELIMINATED!</div>

<div id="hud">
  <div>❤️ HP: <span id="hp-val">100</span></div>
  <div style="font-size: 15px; color: #f1c40f; margin-top: 5px;">⚡ 黄色い床: 大ジャンプ台</div>
</div>

<div id="weapon-hud">
  <div id="cur-weapon">1: ASSAULT RIFLE</div>
  <div id="ammo-hud"><span id="ammo-cur">30</span> / <span id="ammo-max">30</span></div>
  <div style="font-size: 13px; color: #aaa;">[1-5] 武器切替 / [R] リロード / 右クリック: 狙撃</div>
</div>

<div id="kill-log"></div>

<div id="blocker">
  <h1 style="color: #00ffcc; letter-spacing: 5px; font-size: 44px; margin-bottom: 5px;">⚔️ CYBER STRIKE 3D</h1>
  <p style="color: #ccc; margin-bottom: 20px;">WASD: 移動 | SPACE: ジャンプ | SHIFT: ダッシュ | R: リロード | 1~5: 武器</p>
  <input type="text" id="name-input" placeholder="プレイヤー名を入力..." maxlength="10">
  <button id="start-btn">ゲームスタート (クリック)</button>
</div>

<script>
  const socket = io();

  // ================= 🔊 Web Audio 音声エンジン =================
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    if (type === 'ar' || type === 'smg') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'sg') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'sr') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'katana') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'hit') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'kill') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'jump') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.25);
    }
  }

  // ================= 武器データ ＆ 弾薬 =================
  const WEAPONS = {
    1: { name: 'ASSAULT RIFLE', sound: 'ar', damage: 24, delay: 120, range: 120, auto: true, count: 1, spread: 0.015, maxAmmo: 30, curAmmo: 30, reloadTime: 1200 },
    2: { name: 'SHOTGUN', sound: 'sg', damage: 16, delay: 750, range: 30, auto: false, count: 8, spread: 0.08, maxAmmo: 6, curAmmo: 6, reloadTime: 1800 },
    3: { name: 'SNIPER RIFLE', sound: 'sr', damage: 110, delay: 1100, range: 300, auto: false, count: 1, spread: 0.0001, scope: true, maxAmmo: 5, curAmmo: 5, reloadTime: 2000 },
    4: { name: 'SMG', sound: 'smg', damage: 14, delay: 70, range: 50, auto: true, count: 1, spread: 0.04, maxAmmo: 40, curAmmo: 40, reloadTime: 1000 },
    5: { name: 'KATANA', sound: 'katana', damage: 95, delay: 350, range: 2.8, auto: false, count: 1, spread: 0, melee: true, maxAmmo: '∞', curAmmo: '∞' }
  };

  let currentWeaponIndex = 1;
  let lastShotTime = 0;
  let isAiming = false;
  let isShooting = false;
  let isReloading = false;
  let myId = null;

  function updateAmmoUI() {
    const w = WEAPONS[currentWeaponIndex];
    document.getElementById('ammo-cur').innerText = isReloading ? 'RELOAD...' : w.curAmmo;
    document.getElementById('ammo-max').innerText = w.maxAmmo;
  }

  function reload() {
    const w = WEAPONS[currentWeaponIndex];
    if (w.melee || isReloading || w.curAmmo === w.maxAmmo) return;
    isReloading = true;
    updateAmmoUI();
    setTimeout(() => {
      w.curAmmo = w.maxAmmo;
      isReloading = false;
      updateAmmoUI();
    }, w.reloadTime);
  }

  // ================= Three.js ＆ レンダラー =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x70b5ff);
  scene.fog = new THREE.Fog(0x70b5ff, 40, 220);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 25);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
  sunLight.position.set(50, 100, 50);
  scene.add(sunLight);

  // 武器モデル
  const weaponHolder = new THREE.Group();
  camera.add(weaponHolder);
  scene.add(camera);

  const gunMesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.16, 0.6),
    new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 })
  );
  gunMesh.position.set(0.28, -0.22, -0.45);
  weaponHolder.add(gunMesh);

  const katanaMesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.8, 0.08),
    new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.9, roughness: 0.1, emissive: 0x00ffff, emissiveIntensity: 0.2 })
  );
  katanaMesh.position.set(0.3, -0.15, -0.4);
  katanaMesh.rotation.set(Math.PI / 4, 0, -Math.PI / 6);
  katanaMesh.visible = false;
  weaponHolder.add(katanaMesh);

  function switchWeaponModel() {
    const isMelee = WEAPONS[currentWeaponIndex].melee;
    gunMesh.visible = !isMelee && !isAiming;
    katanaMesh.visible = isMelee;
  }

  // ================= マップ ＆ コリジョン設定 =================
  const boxes = []; // { minX, maxX, minY, maxY, minZ, maxZ }
  const jumpPads = [];

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(140, 140),
    new THREE.MeshStandardMaterial({ color: 0x8a9ba8, roughness: 0.8 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  function addObstacle(x, y, z, w, h, d, color = 0x2c3e50) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
    mesh.position.set(x, y + h / 2, z);
    scene.add(mesh);

    boxes.push({
      minX: x - w / 2, maxX: x + w / 2,
      minY: y, maxY: y + h,
      minZ: z - d / 2, maxZ: z + d / 2
    });
    return mesh;
  }

  function addJumpPad(x, y, z) {
    const pad = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.4, 4),
      new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf39c12, emissiveIntensity: 0.6 })
    );
    pad.position.set(x, y + 0.2, z);
    scene.add(pad);
    jumpPads.push({ x, z, y: y + 0.2, size: 2.5 });
  }

  // マップ配置
  addObstacle(0, 0, 0, 14, 10, 14, 0x34495e); // 中央タワー
  addJumpPad(0, 0, 11);
  addJumpPad(0, 0, -11);
  addJumpPad(11, 0, 0);
  addJumpPad(-11, 0, 0);

  addObstacle(30, 0, 30, 8, 8, 8, 0x9b59b6);
  addJumpPad(30, 0, 22);
  addObstacle(-30, 0, -30, 8, 8, 8, 0x3498db);
  addJumpPad(-30, 0, -22);

  addObstacle(18, 0, -18, 5, 4, 10, 0xe74c3c);
  addObstacle(-18, 0, 18, 10, 4, 5, 0xe67e22);

  // 外壁
  addObstacle(0, 0, 68, 140, 8, 2, 0x2c3e50);
  addObstacle(0, 0, -68, 140, 8, 2, 0x2c3e50);
  addObstacle(70, 0, 0, 2, 8, 140, 0x2c3e50);
  addObstacle(-70, 0, 0, 2, 8, 140, 0x2c3e50);

  // ================= FPS操作 =================
  const controls = new THREE.PointerLockControls(camera, document.body);
  const blocker = document.getElementById('blocker');

  document.getElementById('start-btn').addEventListener('click', () => {
    socket.emit('join', document.getElementById('name-input').value);
    controls.lock();
  });

  controls.addEventListener('lock', () => blocker.style.display = 'none');
  controls.addEventListener('unlock', () => {
    blocker.style.display = 'flex';
    toggleADS(false);
    // キー入力をすべてリセット
    move.forward = move.backward = move.left = move.right = move.sprint = false;
  });

  const move = { forward: false, backward: false, left: false, right: false, sprint: false };
  let velocityY = 0;
  let canJump = true;

  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (['1','2','3','4','5'].includes(key)) {
      currentWeaponIndex = parseInt(key);
      document.getElementById('cur-weapon').innerText = `${currentWeaponIndex}: ${WEAPONS[currentWeaponIndex].name}`;
      toggleADS(false);
      switchWeaponModel();
      updateAmmoUI();
    }
    if (key === 'r' || e.code === 'KeyR') reload();

    if (e.code === 'KeyW' || key === 'w') move.forward = true;
    if (e.code === 'KeyS' || key === 's') move.backward = true;
    if (e.code === 'KeyA' || key === 'a') move.left = true;
    if (e.code === 'KeyD' || key === 'd') move.right = true;
    if ((e.code === 'Space' || key === ' ') && canJump) { velocityY = 14; canJump = false; }
    if (e.shiftKey || e.code === 'ShiftLeft' || e.code === 'ShiftRight') move.sprint = true;
  });

  window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (e.code === 'KeyW' || key === 'w') move.forward = false;
    if (e.code === 'KeyS' || key === 's') move.backward = false;
    if (e.code === 'KeyA' || key === 'a') move.left = false;
    if (e.code === 'KeyD' || key === 'd') move.right = false;
    if (!e.shiftKey) move.sprint = false;
  });

  window.addEventListener('mousedown', (e) => {
    if (!controls.isLocked) return;
    if (e.button === 0) { isShooting = true; shoot(); }
    if (e.button === 2) toggleADS(true);
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) isShooting = false;
    if (e.button === 2) toggleADS(false);
  });
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  function toggleADS(aim) {
    isAiming = aim;
    const w = WEAPONS[currentWeaponIndex];
    const scopeEl = document.getElementById('sniper-scope');
    const crosshairEl = document.getElementById('crosshair');

    if (aim && w.scope) {
      scopeEl.style.display = 'block';
      crosshairEl.style.display = 'none';
      camera.fov = 14;
      gunMesh.visible = false;
    } else {
      scopeEl.style.display = 'none';
      crosshairEl.style.display = 'block';
      camera.fov = aim ? 50 : 75;
      switchWeaponModel();
    }
    camera.updateProjectionMatrix();
  }

  // ================= プレイヤー当たり判定 =================
  const otherPlayers = {};
  const hitTargets = [];

  function createPlayerMesh(p) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.6), new THREE.MeshStandardMaterial({ color: p.color }));
    body.position.y = 0.9;
    group.add(body);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    head.position.y = 1.9;
    group.add(head);

    group.position.set(p.x, p.y, p.z);
    scene.add(group);

    body.userData = { playerId: p.id };
    head.userData = { playerId: p.id, isHeadshot: true };
    hitTargets.push(body, head);

    return group;
  }

  function createTracer(start, end) {
    const material = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
    const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    setTimeout(() => scene.remove(line), 50);
  }

  // ================= 射撃 / 刀 攻撃システム =================
  const raycaster = new THREE.Raycaster();

  function shoot() {
    const now = Date.now();
    const w = WEAPONS[currentWeaponIndex];
    if (now - lastShotTime < w.delay || isReloading) return;
    if (!w.melee && w.curAmmo <= 0) { reload(); return; }

    lastShotTime = now;
    if (!w.melee) { w.curAmmo--; updateAmmoUI(); }

    playSound(w.sound);

    if (w.melee) {
      katanaMesh.rotation.z += 1.2;
      katanaMesh.position.y += 0.2;
      setTimeout(() => { katanaMesh.rotation.z -= 1.2; katanaMesh.position.y -= 0.2; }, 100);
    } else {
      gunMesh.position.z += 0.12;
      camera.rotation.x += 0.015;
      setTimeout(() => { gunMesh.position.z -= 0.12; camera.rotation.x -= 0.015; }, 50);
    }

    const startPos = camera.position.clone().add(new THREE.Vector3(0.2, -0.2, -0.5).applyEuler(camera.rotation));

    for (let i = 0; i < w.count; i++) {
      const spreadX = (Math.random() - 0.5) * (isAiming ? w.spread * 0.2 : w.spread);
      const spreadY = (Math.random() - 0.5) * (isAiming ? w.spread * 0.2 : w.spread);

      raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
      raycaster.far = w.range;

      const intersects = raycaster.intersectObjects(hitTargets);
      let targetPoint = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(w.range));

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (!w.melee || hit.distance <= w.range) {
          targetPoint = hit.point;
          const hitObj = hit.object;
          const targetId = hitObj.userData.playerId;
          const damage = hitObj.userData.isHeadshot ? w.damage * 1.5 : w.damage;
          socket.emit('hit', { targetId, damage: Math.round(damage), weapon: w.name });
        }
      }

      if (!w.melee) createTracer(startPos, targetPoint);
    }

    if (w.auto && isShooting) setTimeout(shoot, w.delay);
  }

  socket.on('hitSuccess', () => {
    playSound('hit');
    const hm = document.getElementById('hit-marker');
    hm.style.display = 'block';
    setTimeout(() => hm.style.display = 'none', 100);
  });

  // ================= ソケット通信 =================
  socket.on('init', (data) => {
    myId = data.id;
    if (data.players[myId]) {
      const myP = data.players[myId];
      camera.position.set(myP.x, myP.y + 1.6, myP.z);
    }
    for (const id in data.players) {
      if (id !== myId) otherPlayers[id] = createPlayerMesh(data.players[id]);
    }
  });

  socket.on('playerJoined', (p) => { otherPlayers[p.id] = createPlayerMesh(p); });

  socket.on('playerMoved', (p) => {
    if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
      otherPlayers[p.id].rotation.y = p.rotY;
    }
  });

  socket.on('playerLeft', (id) => {
    if (otherPlayers[id]) {
      scene.remove(otherPlayers[id]);
      delete otherPlayers[id];
    }
  });

  socket.on('playerDamaged', (data) => {
    if (data.id === myId) document.getElementById('hp-val').innerText = data.hp;
  });

  socket.on('killLog', (data) => {
    const log = document.getElementById('kill-log');
    const entry = document.createElement('div');
    entry.innerText = `💥 [${data.weapon}] ${data.killer} ➔ ${data.victim}`;
    log.appendChild(entry);
    setTimeout(() => entry.remove(), 4000);

    if (data.killer === (document.getElementById('name-input').value || 'Player')) {
      playSound('kill');
      const kb = document.getElementById('kill-banner');
      kb.classList.add('show');
      setTimeout(() => kb.classList.remove('show'), 1500);
    }
  });

  socket.on('playerRespawn', (p) => {
    if (p.id === myId) {
      camera.position.set(p.x, p.y + 1.6, p.z);
      velocityY = 0;
      document.getElementById('hp-val').innerText = '100';
      WEAPONS[currentWeaponIndex].curAmmo = WEAPONS[currentWeaponIndex].maxAmmo;
      updateAmmoUI();
    } else if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
    }
  });

  // ================= 軸分離・絶対にスタックしない物理エンジン =================
  let prevTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = Math.min((time - prevTime) / 1000, 0.1);
    prevTime = time;

    if (controls.isLocked) {
      const speed = (move.sprint ? 18 : 10) * delta;

      // 前後左右の移動ベクトルを算出
      const moveVector = new THREE.Vector3();
      if (move.forward) moveVector.z -= 1;
      if (move.backward) moveVector.z += 1;
      if (move.left) moveVector.x -= 1;
      if (move.right) moveVector.x += 1;
      moveVector.normalize();

      // カメラの回転に合わせてワールド移動量に変換
      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
      const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

      const deltaX = (forward.x * -moveVector.z + right.x * moveVector.x) * speed;
      const deltaZ = (forward.z * -moveVector.z + right.z * moveVector.x) * speed;

      const playerRadius = 0.45;
      const playerHeight = 1.8;
      const feetY = camera.position.y - 1.6;

      // --- 1. X軸の移動と判定（壁ずり移動用） ---
      camera.position.x += deltaX;
      for (const b of boxes) {
        if (feetY < b.maxY - 0.2 && feetY + playerHeight > b.minY) {
          if (
            camera.position.x + playerRadius > b.minX &&
            camera.position.x - playerRadius < b.maxX &&
            camera.position.z + playerRadius > b.minZ &&
            camera.position.z - playerRadius < b.maxZ
          ) {
            camera.position.x -= deltaX; // X方向のみ押し戻す
            break;
          }
        }
      }

      // --- 2. Z軸の移動と判定（壁ずり移動用） ---
      camera.position.z += deltaZ;
      for (const b of boxes) {
        if (feetY < b.maxY - 0.2 && feetY + playerHeight > b.minY) {
          if (
            camera.position.x + playerRadius > b.minX &&
            camera.position.x - playerRadius < b.maxX &&
            camera.position.z + playerRadius > b.minZ &&
            camera.position.z - playerRadius < b.maxZ
          ) {
            camera.position.z -= deltaZ; // Z方向のみ押し戻す
            break;
          }
        }
      }

      // --- 3. 重力 ＆ ジャンプパッド ---
      velocityY -= 30.0 * delta;
      camera.position.y += velocityY * delta;

      // ジャンプ台判定
      for (const pad of jumpPads) {
        if (Math.abs(camera.position.x - pad.x) < pad.size && Math.abs(camera.position.z - pad.z) < pad.size) {
          if (camera.position.y - 1.6 <= pad.y + 0.8 && camera.position.y - 1.6 >= pad.y - 0.8) {
            velocityY = 25.0;
            playSound('jump');
            canJump = false;
          }
        }
      }

      // --- 4. 足場 ＆ 床着地判定 ---
      let groundY = 0; // 最下層の床
      const px = camera.position.x;
      const pz = camera.position.z;

      for (const b of boxes) {
        if (px >= b.minX - 0.3 && px <= b.maxX + 0.3 && pz >= b.minZ - 0.3 && pz <= b.maxZ + 0.3) {
          if (b.maxY <= camera.position.y - 1.4 && b.maxY > groundY) {
            groundY = b.maxY;
          }
        }
      }

      if (camera.position.y - 1.6 <= groundY) {
        camera.position.y = groundY + 1.6;
        velocityY = 0;
        canJump = true;
      }

      // --- 5. セーフティ（落下脱出） ---
      if (camera.position.y < -10) {
        camera.position.set(0, 5, 25);
        velocityY = 0;
      }

      // サーバー同期
      socket.emit('playerMove', {
        x: camera.position.x,
        y: camera.position.y - 1.6,
        z: camera.position.z,
        rotY: camera.rotation.y
      });
    }

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
