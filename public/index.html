<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>CYBER STRIKE 3D</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; user-select: none; }

    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #00ffcc; }
    #crosshair::before { top: 6px; left: -10px; width: 34px; height: 2px; }
    #crosshair::after { top: -10px; left: 6px; width: 2px; height: 34px; }

    #sniper-scope {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 20;
    }
    .scope-circle {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(75vh, 75vw); height: min(75vh, 75vw);
      border-radius: 50%; border: 3px solid #ff0055;
      box-shadow: 0 0 0 2000px rgba(5, 5, 10, 0.96);
    }
    .scope-line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(255,0,85,0.7); }
    .scope-line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; background: rgba(255,0,85,0.7); }
    .scope-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff0055; transform: translate(-50%, -50%); border-radius: 50%; }

    #hit-marker {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ff0055; font-size: 32px; font-weight: bold; display: none; pointer-events: none; z-index: 15;
    }

    #hud { position: absolute; bottom: 25px; left: 25px; color: #fff; font-size: 22px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px #000; z-index: 10; }
    #weapon-hud { position: absolute; bottom: 25px; right: 25px; color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; text-align: right; text-shadow: 2px 2px 4px #000; z-index: 10; }
    #kill-log { position: absolute; top: 20px; right: 20px; color: #ffeb3b; font-size: 15px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 3px #000; z-index: 10; }

    #blocker {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 25, 0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; z-index: 100;
    }
    input {
      padding: 12px 20px; font-size: 20px; border-radius: 8px; border: 2px solid #00ffcc;
      background: #111; color: #fff; margin-bottom: 15px; text-align: center; outline: none;
    }
    button {
      padding: 14px 40px; font-size: 20px; font-weight: bold; background: #00ffcc;
      border: none; border-radius: 8px; cursor: pointer; color: #000;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="sniper-scope">
  <div class="scope-circle">
    <div class="scope-line-h"></div>
    <div class="scope-line-v"></div>
    <div class="scope-dot"></div>
  </div>
</div>
<div id="hit-marker">✕</div>

<div id="hud">
  <div>❤️ HP: <span id="hp-val">100</span></div>
  <div style="font-size: 15px; color: #f1c40f; margin-top: 5px;">⚡ 黄色い床: 大ジャンプ台</div>
</div>

<div id="weapon-hud">
  <div id="cur-weapon">1: ASSAULT RIFLE</div>
  <div style="font-size: 14px; color: #aaa; margin-top: 5px;">[1-5] 武器切替 / 右クリック: 狙撃</div>
</div>

<div id="kill-log"></div>

<div id="blocker">
  <h1 style="color: #00ffcc; letter-spacing: 5px; font-size: 42px; margin-bottom: 5px;">⚔️ CYBER STRIKE 3D</h1>
  <p style="color: #ccc; margin-bottom: 20px;">WASD: 移動 | SPACE: ジャンプ | SHIFT: ダッシュ | 1~5: 武器</p>
  <input type="text" id="name-input" placeholder="プレイヤー名を入力..." maxlength="10">
  <button id="start-btn">参戦する (クリック)</button>
</div>

<script>
  const socket = io();

  const WEAPONS = {
    1: { name: 'ASSAULT RIFLE', damage: 24, delay: 120, range: 120, auto: true, count: 1, spread: 0.015 },
    2: { name: 'SHOTGUN', damage: 16, delay: 750, range: 30, auto: false, count: 8, spread: 0.08 },
    3: { name: 'SNIPER RIFLE', damage: 110, delay: 1100, range: 300, auto: false, count: 1, spread: 0.0001, scope: true },
    4: { name: 'SMG', damage: 14, delay: 70, range: 50, auto: true, count: 1, spread: 0.04 },
    5: { name: 'KATANA', damage: 95, delay: 350, range: 2.8, auto: false, count: 1, spread: 0, melee: true }
  };

  let currentWeaponIndex = 1;
  let lastShotTime = 0;
  let isAiming = false;
  let isShooting = false;
  let myId = null;

  // ================= Three.js 基本設定 =================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x70b5ff);
  scene.fog = new THREE.Fog(0x70b5ff, 40, 220);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  // 初期位置を安全な外側に配置 (タワーの外)
  camera.position.set(0, 1.6, 25);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambientLight);
  const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
  sunLight.position.set(50, 100, 50);
  scene.add(sunLight);

  // ================= 立体マップ ＆ コリジョン =================
  const colliders = [];
  const jumpPads = [];

  const floorGeo = new THREE.PlaneGeometry(140, 140);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x8a9ba8, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  function addObstacle(x, y, z, w, h, d, color = 0x2c3e50) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
    );
    mesh.position.set(x, y + h / 2, z);
    scene.add(mesh);

    const box = new THREE.Box3().setFromObject(mesh);
    colliders.push(box);
    return mesh;
  }

  function addJumpPad(x, y, z) {
    const pad = new THREE.Mesh(
      new THREE.BoxGeometry(4, 0.4, 4),
      new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf39c12, emissiveIntensity: 0.6 })
    );
    pad.position.set(x, y + 0.2, z);
    scene.add(pad);
    jumpPads.push({ x, z, y: y + 0.2, size: 2.5 });
  }

  // マップ配置
  addObstacle(0, 0, 0, 14, 10, 14, 0x34495e); // 中央タワー
  addJumpPad(0, 0, 11); // 南ジャンプ台
  addJumpPad(0, 0, -11); // 北ジャンプ台
  addJumpPad(11, 0, 0); // 東ジャンプ台
  addJumpPad(-11, 0, 0); // 西ジャンプ台

  addObstacle(30, 0, 30, 8, 8, 8, 0x9b59b6);
  addJumpPad(30, 0, 22);

  addObstacle(-30, 0, -30, 8, 8, 8, 0x3498db);
  addJumpPad(-30, 0, -22);

  addObstacle(18, 0, -18, 5, 4, 10, 0xe74c3c);
  addObstacle(-18, 0, 18, 10, 4, 5, 0xe67e22);

  // 外壁
  addObstacle(0, 0, 68, 140, 8, 2, 0x2c3e50);
  addObstacle(0, 0, -68, 140, 8, 2, 0x2c3e50);
  addObstacle(68, 0, 0, 2, 8, 140, 0x2c3e50);
  addObstacle(-68, 0, 0, 2, 8, 140, 0x2c3e50);

  // ================= FPS操作 =================
  const controls = new THREE.PointerLockControls(camera, document.body);
  const blocker = document.getElementById('blocker');

  document.getElementById('start-btn').addEventListener('click', () => {
    const name = document.getElementById('name-input').value;
    socket.emit('join', name);
    controls.lock();
  });

  controls.addEventListener('lock', () => blocker.style.display = 'none');
  controls.addEventListener('unlock', () => {
    blocker.style.display = 'flex';
    toggleADS(false);
  });

  const move = { forward: false, backward: false, left: false, right: false, sprint: false };
  let velocityY = 0;
  let canJump = true;

  window.addEventListener('keydown', (e) => {
    if (['1','2','3','4','5'].includes(e.key)) {
      currentWeaponIndex = parseInt(e.key);
      document.getElementById('cur-weapon').innerText = `${currentWeaponIndex}: ${WEAPONS[currentWeaponIndex].name}`;
      toggleADS(false);
    }
    const k = e.code;
    if (k === 'KeyW') move.forward = true;
    if (k === 'KeyS') move.backward = true;
    if (k === 'KeyA') move.left = true;
    if (k === 'KeyD') move.right = true;
    if (k === 'Space' && canJump) { velocityY = 13; canJump = false; }
    if (k === 'ShiftLeft' || k === 'ShiftRight') move.sprint = true;
  });

  window.addEventListener('keyup', (e) => {
    const k = e.code;
    if (k === 'KeyW') move.forward = false;
    if (k === 'KeyS') move.backward = false;
    if (k === 'KeyA') move.left = false;
    if (k === 'KeyD') move.right = false;
    if (k === 'ShiftLeft' || k === 'ShiftRight') move.sprint = false;
  });

  window.addEventListener('mousedown', (e) => {
    if (!controls.isLocked) return;
    if (e.button === 0) { isShooting = true; shoot(); }
    if (e.button === 2) toggleADS(true);
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) isShooting = false;
    if (e.button === 2) toggleADS(false);
  });
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  function toggleADS(aim) {
    isAiming = aim;
    const w = WEAPONS[currentWeaponIndex];
    const scopeEl = document.getElementById('sniper-scope');
    const crosshairEl = document.getElementById('crosshair');

    if (aim && w.scope) {
      scopeEl.style.display = 'block';
      crosshairEl.style.display = 'none';
      camera.fov = 14;
    } else {
      scopeEl.style.display = 'none';
      crosshairEl.style.display = 'block';
      camera.fov = aim ? 50 : 75;
    }
    camera.updateProjectionMatrix();
  }

  // ================= プレイヤー当たり判定 =================
  const otherPlayers = {};
  const hitTargets = [];

  function createPlayerMesh(p) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.4, 0.6), new THREE.MeshStandardMaterial({ color: p.color }));
    body.position.y = 0.9;
    group.add(body);

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    head.position.y = 1.9;
    group.add(head);

    group.position.set(p.x, p.y, p.z);
    scene.add(group);

    body.userData = { playerId: p.id };
    head.userData = { playerId: p.id, isHeadshot: true };
    hitTargets.push(body, head);

    return group;
  }

  const raycaster = new THREE.Raycaster();

  function shoot() {
    const now = Date.now();
    const w = WEAPONS[currentWeaponIndex];
    if (now - lastShotTime < w.delay) return;
    lastShotTime = now;

    if (w.melee) {
      camera.rotation.z += 0.15;
      setTimeout(() => camera.rotation.z -= 0.15, 90);
    }

    for (let i = 0; i < w.count; i++) {
      const spreadX = (Math.random() - 0.5) * (isAiming ? w.spread * 0.2 : w.spread);
      const spreadY = (Math.random() - 0.5) * (isAiming ? w.spread * 0.2 : w.spread);

      raycaster.setFromCamera(new THREE.Vector2(spreadX, spreadY), camera);
      raycaster.far = w.range;

      const intersects = raycaster.intersectObjects(hitTargets);
      if (intersects.length > 0) {
        const hit = intersects[0];
        if (!w.melee || hit.distance <= w.range) {
          const hitObj = hit.object;
          const targetId = hitObj.userData.playerId;
          const damage = hitObj.userData.isHeadshot ? w.damage * 1.5 : w.damage;
          socket.emit('hit', { targetId, damage: Math.round(damage), weapon: w.name });
        }
      }
    }

    if (w.auto && isShooting) {
      setTimeout(shoot, w.delay);
    }
  }

  socket.on('hitSuccess', () => {
    const hm = document.getElementById('hit-marker');
    hm.style.display = 'block';
    setTimeout(() => hm.style.display = 'none', 120);
  });

  // ================= ソケット通信 =================
  socket.on('init', (data) => {
    myId = data.id;
    if (data.players[myId]) {
      const myP = data.players[myId];
      camera.position.set(myP.x, myP.y + 1.6, myP.z);
    }
    for (const id in data.players) {
      if (id !== myId) otherPlayers[id] = createPlayerMesh(data.players[id]);
    }
  });

  socket.on('playerJoined', (p) => { otherPlayers[p.id] = createPlayerMesh(p); });

  socket.on('playerMoved', (p) => {
    if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
      otherPlayers[p.id].rotation.y = p.rotY;
    }
  });

  socket.on('playerLeft', (id) => {
    if (otherPlayers[id]) {
      scene.remove(otherPlayers[id]);
      delete otherPlayers[id];
    }
  });

  socket.on('playerDamaged', (data) => {
    if (data.id === myId) document.getElementById('hp-val').innerText = data.hp;
  });

  socket.on('killLog', (data) => {
    const log = document.getElementById('kill-log');
    const entry = document.createElement('div');
    entry.innerText = `💥 [${data.weapon}] ${data.killer} ➔ ${data.victim}`;
    log.appendChild(entry);
    setTimeout(() => entry.remove(), 4000);
  });

  socket.on('playerRespawn', (p) => {
    if (p.id === myId) {
      camera.position.set(p.x, p.y + 1.6, p.z);
      velocityY = 0;
      document.getElementById('hp-val').innerText = '100';
    } else if (otherPlayers[p.id]) {
      otherPlayers[p.id].position.set(p.x, p.y, p.z);
    }
  });

  // ================= 物理・移動アニメーション =================
  let prevTime = performance.now();

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = Math.min((time - prevTime) / 1000, 0.1);
    prevTime = time;

    if (controls.isLocked) {
      const speed = (move.sprint ? 18 : 10) * delta;
      const prevX = camera.position.x;
      const prevZ = camera.position.z;

      if (move.forward) controls.moveForward(speed);
      if (move.backward) controls.moveForward(-speed);
      if (move.left) controls.moveRight(-speed);
      if (move.right) controls.moveRight(speed);

      // 壁コリジョン
      const playerRadius = 0.5;
      const playerFeetY = camera.position.y - 1.6;

      for (const box of colliders) {
        if (playerFeetY < box.max.y - 0.2 && playerFeetY + 1.8 > box.min.y) {
          if (
            camera.position.x + playerRadius > box.min.x &&
            camera.position.x - playerRadius < box.max.x &&
            camera.position.z + playerRadius > box.min.z &&
            camera.position.z - playerRadius < box.max.z
          ) {
            camera.position.x = prevX;
            camera.position.z = prevZ;
            break;
          }
        }
      }

      // 重力とジャンプ
      velocityY -= 28.0 * delta;
      camera.position.y += velocityY * delta;

      // ジャンプ台判定
      for (const pad of jumpPads) {
        if (Math.abs(camera.position.x - pad.x) < pad.size && Math.abs(camera.position.z - pad.z) < pad.size) {
          if (camera.position.y - 1.6 <= pad.y + 0.8 && camera.position.y - 1.6 >= pad.y - 0.8) {
            velocityY = 25.0; // 大ジャンプ！
            canJump = false;
          }
        }
      }

      // 足場着地判定
      let groundY = 0;
      const pX = camera.position.x;
      const pZ = camera.position.z;

      for (const box of colliders) {
        if (pX >= box.min.x - 0.4 && pX <= box.max.x + 0.4 && pZ >= box.min.z - 0.4 && pZ <= box.max.z + 0.4) {
          if (box.max.y <= camera.position.y - 1.4 && box.max.y > groundY) {
            groundY = box.max.y;
          }
        }
      }

      if (camera.position.y - 1.6 <= groundY) {
        camera.position.y = groundY + 1.6;
        velocityY = 0;
        canJump = true;
      }

      // サーバー同期
      socket.emit('playerMove', {
        x: camera.position.x,
        y: camera.position.y - 1.6,
        z: camera.position.z,
        rotY: camera.rotation.y
      });
    }

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
