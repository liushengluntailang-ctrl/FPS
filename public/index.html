<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Minecraft PvP Online (Render)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      background: #111;
      color: #fff;
    }

    #lobby-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      z-index: 100;
      overflow-y: auto;
    }
    .lobby-box {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    h1 { margin: 0 0 10px 0; text-align: center; text-shadow: 2px 2px 4px #000; letter-spacing: 2px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      font-size: 15px;
    }
    input:focus, select:focus { outline: none; border-color: #2ecc71; }
    button { background: #27ae60; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
    button:hover { background: #2ecc71; }
    .status-msg { font-size: 14px; text-align: center; margin-top: 4px; font-weight: bold; }

    .room-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .room-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mode-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin: 6px 0; }
    .mode-skywars { background: #e67e22; }
    .mode-bedwars { background: #e74c3c; }
    .mode-custom { background: #3498db; }

    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); }
    #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
    #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

    #hud {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(0, 0, 0, 0.6); padding: 12px 18px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #hud button { margin-top: 8px; padding: 5px 10px; font-size: 12px; background: #c0392b; }

    #hotbar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 8px; z-index: 10;
    }
    .slot {
      width: 50px; height: 50px; border: 2px solid #555; border-radius: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; background: #222; cursor: pointer;
    }
    .slot.active { border-color: #f1c40f; background: #444; }

    #hp-container {
      position: absolute; bottom: 82px; left: 50%; transform: translateX(-50%); width: 220px; z-index: 10;
    }
    #hp-bar-bg { width: 100%; height: 14px; background: #333; border: 2px solid #fff; border-radius: 4px; overflow: hidden; }
    #hp-bar { width: 100%; height: 100%; background: #e74c3c; transition: width 0.15s; }
  </style>
</head>
<body>

  <div id="lobby-screen">
    <div class="lobby-box">
      <h1>MINECRAFT PvP ONLINE</h1>
      <div class="input-group">
        <input type="text" id="server-url" placeholder="https://あなたのアプリ.onrender.com" style="flex: 2;">
        <input type="text" id="player-name" placeholder="プレイヤー名" value="Steve" style="flex: 1;">
        <button id="btn-connect">接続する</button>
      </div>
      <div id="conn-status" class="status-msg" style="color: #f1c40f;">※RenderのURLを入力して「接続する」を押してください</div>
    </div>

    <div class="lobby-box" id="rooms-section" style="display: none;">
      <h3>部屋を新規作成</h3>
      <div class="input-group">
        <input type="text" id="new-room-name" placeholder="部屋の名前" style="flex: 2;">
        <select id="new-room-mode" style="flex: 1;">
          <option value="skywars">SkyWars (浮島PvP)</option>
          <option value="bedwars">BedWars (ベッド防衛戦)</option>
          <option value="custom">カスタム建築 (自由作成)</option>
        </select>
        <button id="btn-create-room">部屋を作成</button>
      </div>

      <h3 style="margin-top: 25px;">参加可能な部屋一覧</h3>
      <div class="room-list" id="room-list">
        <p style="color: #aaa;">部屋がまだありません。上のフォームから作成してください！</p>
      </div>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="hud">
    <div id="room-info" style="font-weight: bold; font-size: 16px;"></div>
    <div id="game-status" style="font-size: 13px; color: #ddd; margin-top: 4px;"></div>
    <button id="btn-leave">ロビーへ戻る</button>
  </div>

  <div id="hp-container">
    <div id="hp-bar-bg"><div id="hp-bar"></div></div>
  </div>

  <div id="hotbar">
    <div class="slot active" data-slot="1"><span>🗡️</span><span>剣</span></div>
    <div class="slot" data-slot="2"><span style="color:#55a832">■</span><span>草</span></div>
    <div class="slot" data-slot="3"><span style="color:#888888">■</span><span>石</span></div>
    <div class="slot" data-slot="4"><span style="color:#a0522d">■</span><span>木</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    let socket;
    let myPlayer = null;
    let currentRoom = null;
    const otherPlayers = {};
    const worldBlocks = {};

    let selectedSlot = 1;
    const blockColors = { 2: 0x55a832, 3: 0x7f8c8d, 4: 0x8b5a2b };

    const lobbyScreen = document.getElementById("lobby-screen");
    const roomsSection = document.getElementById("rooms-section");
    const roomListDiv = document.getElementById("room-list");
    const hpBar = document.getElementById("hp-bar");
    const roomInfo = document.getElementById("room-info");
    const gameStatus = document.getElementById("game-status");
    const connStatus = document.getElementById("conn-status");
    const serverUrlInput = document.getElementById("server-url");

    if (localStorage.getItem("renderServerUrl")) {
      serverUrlInput.value = localStorage.getItem("renderServerUrl");
    }

    window.addEventListener("keydown", (e) => {
      if (["1", "2", "3", "4"].includes(e.key)) {
        selectedSlot = parseInt(e.key);
        document.querySelectorAll(".slot").forEach(s => {
          s.classList.toggle("active", s.getAttribute("data-slot") == selectedSlot);
        });
      }
    });

    document.getElementById("btn-connect").addEventListener("click", () => {
      let url = serverUrlInput.value.trim();
      if (!url) return alert("RenderのURLを入力してください！");
      if (url.endsWith("/")) url = url.slice(0, -1);
      localStorage.setItem("renderServerUrl", url);
      connect(url);
    });

    document.getElementById("btn-create-room").addEventListener("click", () => {
      if (!socket || !socket.connected) return alert("サーバーに接続されていません！");
      const name = document.getElementById("new-room-name").value.trim();
      const mode = document.getElementById("new-room-mode").value;
      socket.emit("createRoom", { name, mode });
    });

    document.getElementById("btn-leave").addEventListener("click", () => {
      document.exitPointerLock();
      if (socket) socket.emit("leaveRoom");
      cleanupGameWorld();
      lobbyScreen.style.display = "flex";
    });

    function connect(url) {
      connStatus.style.color = "#f1c40f";
      connStatus.innerText = "🚀 Renderサーバーに接続中... (初回起動時は数十秒待つ場合があります)";

      socket = io(url, {
        transports: ["websocket", "polling"],
        reconnection: true
      });

      socket.on("connect", () => {
        connStatus.style.color = "#2ecc71";
        connStatus.innerText = "🟢 サーバーに接続成功！";
        roomsSection.style.display = "block";
        socket.emit("getRooms");
      });

      socket.on("connect_error", (err) => {
        connStatus.style.color = "#e74c3c";
        connStatus.innerText = "🔴 接続エラー: サーバーが立ち上がるまで30秒ほど待ってから再度押してください。";
      });

      socket.on("roomList", (rooms) => {
        roomListDiv.innerHTML = "";
        if (rooms.length === 0) {
          roomListDiv.innerHTML = "<p style='color: #aaa;'>部屋がありません。新しく作成してください！</p>";
          return;
        }
        rooms.forEach(r => {
          const card = document.createElement("div");
          card.className = "room-card";
          card.innerHTML = `
            <div>
              <strong style="font-size: 16px;">${r.name}</strong>
              <div><span class="mode-tag mode-${r.mode}">${r.mode.toUpperCase()}</span></div>
              <div style="font-size: 13px; color: #ccc; margin: 8px 0;">参加者: ${r.playerCount}人</div>
            </div>
            <button onclick="joinRoom('${r.id}')">参加する</button>
          `;
          roomListDiv.appendChild(card);
        });
      });

      socket.on("roomCreated", (roomId) => joinRoom(roomId));

      socket.on("roomJoined", (data) => {
        currentRoom = data.roomInfo;
        myPlayer = data.myPlayer;

        lobbyScreen.style.display = "none";
        document.body.requestPointerLock();

        roomInfo.innerText = `[${currentRoom.mode.toUpperCase()}] ${currentRoom.name}`;
        gameStatus.innerText = currentRoom.mode === "skywars" ? "落ちたら即死！中央島を目指せ！" :
                               currentRoom.mode === "bedwars" ? "相手のベッドブロックを破壊しろ！" : "自由建築モード";

        initMap(currentRoom.mode, data.blocks);

        for (const id in data.players) {
          if (id !== socket.id) addOtherPlayer(data.players[id]);
        }
      });

      socket.on("playerJoinedRoom", (player) => addOtherPlayer(player));
      socket.on("playerMoved", (pos) => {
        if (otherPlayers[pos.id]) {
          otherPlayers[pos.id].position.set(pos.x, pos.y, pos.z);
          otherPlayers[pos.id].rotation.y = pos.yaw;
        }
      });
      socket.on("playerLeftRoom", (id) => {
        if (otherPlayers[id]) {
          scene.remove(otherPlayers[id]);
          delete otherPlayers[id];
        }
      });

      socket.on("blockPlaced", (b) => addBlockMesh(b.x, b.y, b.z, b.color));
      socket.on("blockBroken", (pos) => removeBlockMesh(pos.x, pos.y, pos.z));

      socket.on("playerAction", (action) => {
        if (action.type === "hit" && action.targetId === socket.id) {
          takeDamage(action.damage);
        }
      });
    }

    window.joinRoom = function(roomId) {
      const playerName = document.getElementById("player-name").value.trim() || "Steve";
      socket.emit("joinRoom", { roomId, playerName });
    };

    // --- Three.js ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 20, 90);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 0.85);
    light.position.set(30, 50, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    function addBlockMesh(x, y, z, color) {
      const key = `${x},${y},${z}`;
      if (worldBlocks[key]) return;
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(boxGeo, mat);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.userData = { x, y, z, isBed: color === 0xc0392b };
      scene.add(mesh);
      worldBlocks[key] = mesh;
    }

    function removeBlockMesh(x, y, z) {
      const key = `${x},${y},${z}`;
      if (worldBlocks[key]) {
        scene.remove(worldBlocks[key]);
        delete worldBlocks[key];
      }
    }

    function initMap(mode, existingBlocks) {
      cleanupGameWorld();

      if (mode === "skywars") {
        createIsland(0, 5, 0, 5, 0x55a832);
        createIsland(20, 5, 0, 3, 0x55a832);
        createIsland(-20, 5, 0, 3, 0x55a832);
        createIsland(0, 5, 20, 3, 0x55a832);
        createIsland(0, 5, -20, 3, 0x55a832);
        camera.position.set(20, 7.6, 0);
      } else if (mode === "bedwars") {
        createIsland(-15, 5, 0, 4, 0xe74c3c);
        createIsland(15, 5, 0, 4, 0x3498db);
        createIsland(0, 5, 0, 4, 0x2ecc71);
        addBlockMesh(-15, 6, 0, 0xc0392b);
        addBlockMesh(15, 6, 0, 0x2471a3);
        camera.position.set(-15, 7.6, 0);
      } else {
        createIsland(0, 0, 0, 6, 0x55a832);
        camera.position.set(0, 2.6, 5);
      }

      if (existingBlocks) {
        for (const key in existingBlocks) {
          const [bx, by, bz] = key.split(",").map(Number);
          addBlockMesh(bx, by, bz, existingBlocks[key]);
        }
      }
    }

    function createIsland(cx, cy, cz, radius, color) {
      for (let x = -radius; x <= radius; x++) {
        for (let z = -radius; z <= radius; z++) {
          if (x*x + z*z <= radius*radius) {
            addBlockMesh(cx + x, cy, cz + z, color);
            addBlockMesh(cx + x, cy - 1, cz + z, 0x7f8c8d);
          }
        }
      }
    }

    function cleanupGameWorld() {
      for (const key in worldBlocks) scene.remove(worldBlocks[key]);
      for (const id in otherPlayers) scene.remove(otherPlayers[id]);
      Object.keys(worldBlocks).length = 0;
      Object.keys(otherPlayers).length = 0;
    }

    function addOtherPlayer(p) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
      body.position.y = 0.9;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshLambertMaterial({ color: 0xf1c40f }));
      head.position.y = 1.5;
      group.add(body); group.add(head);
      group.position.set(p.x, p.y, p.z);
      scene.add(group);
      otherPlayers[p.id] = group;
    }

    let isLocked = false, pitch = 0, yaw = 0;
    let playerY = 7.6, velocityY = 0, hp = 100;
    const keys = {};

    document.addEventListener("click", () => {
      if (currentRoom && !isLocked) document.body.requestPointerLock();
    });
    document.addEventListener("pointerlockchange", () => {
      isLocked = document.pointerLockElement === document.body;
    });

    document.addEventListener("mousemove", (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
      camera.rotation.set(0, 0, 0);
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    window.addEventListener("mousedown", (e) => {
      if (!isLocked) return;
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      if (e.button === 0) {
        if (selectedSlot === 1) {
          for (const id in otherPlayers) {
            const hits = raycaster.intersectObjects(otherPlayers[id].children);
            if (hits.length > 0 && hits[0].distance < 3.5) {
              socket.emit("action", { type: "hit", targetId: id, damage: 25 });
              break;
            }
          }
        } else {
          const hits = raycaster.intersectObjects(Object.values(worldBlocks));
          if (hits.length > 0 && hits[0].distance < 5) {
            const target = hits[0].object.userData;
            removeBlockMesh(target.x, target.y, target.z);
            socket.emit("breakBlock", { x: target.x, y: target.y, z: target.z });
          }
        }
      }

      if (e.button === 2 && selectedSlot !== 1) {
        const hits = raycaster.intersectObjects(Object.values(worldBlocks));
        if (hits.length > 0 && hits[0].distance < 5) {
          const hit = hits[0];
          const pos = hit.object.userData;
          const normal = hit.face.normal;
          const nx = pos.x + normal.x;
          const ny = pos.y + normal.y;
          const nz = pos.z + normal.z;
          const color = blockColors[selectedSlot];
          addBlockMesh(nx, ny, nz, color);
          socket.emit("placeBlock", { x: nx, y: ny, z: nz, color });
        }
      }
    });

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    function takeDamage(amount) {
      hp = Math.max(0, hp - amount);
      hpBar.style.width = hp + "%";
      velocityY = 5;
      if (hp <= 0) {
        alert("撃破されました！リスポーンします。");
        hp = 100;
        hpBar.style.width = "100%";
        camera.position.set(0, 15, 0);
        velocityY = 0;
      }
    }

    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (isLocked && currentRoom) {
        const moveVec = new THREE.Vector3();
        if (keys["KeyW"]) moveVec.z -= 1;
        if (keys["KeyS"]) moveVec.z += 1;
        if (keys["KeyA"]) moveVec.x -= 1;
        if (keys["KeyD"]) moveVec.x += 1;
        moveVec.normalize();

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.position.addScaledVector(forward, -moveVec.z * 8 * delta);
        camera.position.addScaledVector(right, moveVec.x * 8 * delta);

        velocityY -= 20 * delta;
        camera.position.y += velocityY * delta;

        const bKey = `${Math.floor(camera.position.x)},${Math.floor(camera.position.y - 1.6)},${Math.floor(camera.position.z)}`;
        if (worldBlocks[bKey] && velocityY < 0) {
          camera.position.y = Math.floor(camera.position.y - 1.6) + 2.5;
          velocityY = 0;
          if (keys["Space"]) velocityY = 7.5;
        }

        if (camera.position.y < -10) takeDamage(100);

        if (socket && socket.connected) {
          socket.emit("move", {
            x: camera.position.x,
            y: camera.position.y - 1.5,
            z: camera.position.z,
            yaw: yaw,
            pitch: pitch
          });
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
