<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Minecraft PvP Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      user-select: none;
      background: #111;
      color: #fff;
    }

    /* ロビー画面 */
    #lobby-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1b2838 0%, #2a475e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      z-index: 100;
      overflow-y: auto;
    }
    .lobby-box {
      background: rgba(0, 0, 0, 0.8);
      border: 3px solid #555;
      border-radius: 6px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 10px 0; text-align: center; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; color: #55ff55; }
    .input-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, button {
      padding: 10px 14px;
      border-radius: 4px;
      border: 2px solid #555;
      background: #222;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
    }
    input:focus, select:focus { outline: none; border-color: #55ff55; }
    button { background: #2e7d32; cursor: pointer; border: 2px solid #1b5e20; font-weight: bold; transition: 0.1s; }
    button:hover { background: #388e3c; }
    .status-msg { font-size: 14px; text-align: center; margin-top: 4px; font-weight: bold; color: #55ff55; }

    .room-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
    .room-card {
      background: #222;
      border: 2px solid #444;
      border-radius: 4px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mode-tag { display: inline-block; padding: 3px 8px; font-size: 11px; font-weight: bold; margin: 6px 0; border: 1px solid #fff; }
    .mode-skywars { background: #e67e22; }
    .mode-bedwars { background: #c0392b; }
    .mode-custom { background: #2980b9; }

    /* 照準 */
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 2px #000; }
    #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
    #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }

    /* HUD */
    #hud {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(0, 0, 0, 0.6); padding: 12px 18px; border-radius: 4px;
      border: 2px solid #555;
    }
    #hud button { margin-top: 8px; padding: 6px 12px; font-size: 12px; background: #c0392b; border: 1px solid #7f1d1d; }

    /* ハート型HPバー */
    #hearts-container {
      position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; z-index: 10; font-size: 20px;
    }

    /* マイクラ風ホットバー */
    #hotbar {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; background: #222; padding: 4px; border: 3px solid #555;
      border-radius: 4px; z-index: 10;
    }
    .slot {
      width: 52px; height: 52px; border: 2px solid #333;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 11px; background: #111; cursor: pointer; position: relative;
    }
    .slot.active { border: 3px solid #fff; background: #333; }
    .slot-key { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #888; }
  </style>
</head>
<body>

  <div id="lobby-screen">
    <div class="lobby-box">
      <h1>MINECRAFT PvP ONLINE</h1>
      <div id="conn-status" class="status-msg">🟢 サーバー接続中...</div>
      <div class="input-group" style="margin-top: 14px;">
        <input type="text" id="player-name" placeholder="プレイヤー名" value="Steve" style="flex: 1;">
      </div>
    </div>

    <div class="lobby-box" id="rooms-section">
      <h3 style="margin-top: 0;">部屋を新規作成</h3>
      <div class="input-group">
        <input type="text" id="new-room-name" placeholder="部屋の名前" style="flex: 2;">
        <select id="new-room-mode" style="flex: 1;">
          <option value="skywars">SkyWars (浮島PvP)</option>
          <option value="bedwars">BedWars (ベッド防衛戦)</option>
          <option value="custom">カスタム建築 (自由作成)</option>
        </select>
        <button id="btn-create-room">部屋を作成</button>
      </div>

      <h3 style="margin-top: 25px;">部屋一覧</h3>
      <div class="room-list" id="room-list">
        <p style="color: #aaa;">部屋がまだありません。上のフォームから作成してください！</p>
      </div>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="hud">
    <div id="room-info" style="font-weight: bold; font-size: 16px; color: #55ff55;"></div>
    <div id="game-status" style="font-size: 12px; color: #ccc; margin-top: 4px;"></div>
    <button id="btn-leave">ロビーへ戻る</button>
  </div>

  <!-- ハート型ライフゲージ（10個） -->
  <div id="hearts-container"></div>

  <!-- ホットバー -->
  <div id="hotbar">
    <div class="slot active" data-slot="1"><span class="slot-key">1</span><span>🗡️</span><span>鉄の剣</span></div>
    <div class="slot" data-slot="2"><span class="slot-key">2</span><span style="color:#55ff55">■</span><span>草</span></div>
    <div class="slot" data-slot="3"><span class="slot-key">3</span><span style="color:#aaaaaa">■</span><span>石</span></div>
    <div class="slot" data-slot="4"><span class="slot-key">4</span><span style="color:#aa5500">■</span><span>木</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // --- マイクラ風 16x16 プロシージャル・ドット絵テクスチャ生成 ---
    function makePixelTexture(colorBase, noiseColor, isGrass = false) {
      const cvs = document.createElement("canvas");
      cvs.width = 16; cvs.height = 16;
      const ctx = cvs.getContext("2d");
      ctx.fillStyle = colorBase;
      ctx.fillRect(0, 0, 16, 16);

      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          if (Math.random() > 0.6) {
            ctx.fillStyle = noiseColor;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
      if (isGrass) {
        // 草ブロック側面の緑のタレ
        ctx.fillStyle = "#59c02d";
        ctx.fillRect(0, 0, 16, 3);
        for (let x = 0; x < 16; x++) {
          if (Math.random() > 0.4) ctx.fillRect(x, 3, 1, Math.floor(Math.random() * 3));
        }
      }
      const tex = new THREE.CanvasTexture(cvs);
      tex.magFilter = THREE.NearestFilter; // ピクセル感をくっきり出す
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    const texGrassTop = makePixelTexture("#59c02d", "#4da326");
    const texGrassSide = makePixelTexture("#866043", "#6d4e35", true);
    const texDirt = makePixelTexture("#866043", "#6d4e35");
    const texStone = makePixelTexture("#7f7f7f", "#666666");
    const texWood = makePixelTexture("#9e7a44", "#7a5e33");
    const texBed = makePixelTexture("#c0392b", "#e74c3c");

    // 草ブロック用マルチマテリアル（上:草、側面:タレ、下:土）
    const matGrassBlock = [
      new THREE.MeshLambertMaterial({ map: texGrassSide }),
      new THREE.MeshLambertMaterial({ map: texGrassSide }),
      new THREE.MeshLambertMaterial({ map: texGrassTop }),
      new THREE.MeshLambertMaterial({ map: texDirt }),
      new THREE.MeshLambertMaterial({ map: texGrassSide }),
      new THREE.MeshLambertMaterial({ map: texGrassSide })
    ];
    const matStoneBlock = new THREE.MeshLambertMaterial({ map: texStone });
    const matWoodBlock = new THREE.MeshLambertMaterial({ map: texWood });
    const matBedBlock = new THREE.MeshLambertMaterial({ map: texBed });

    const matByType = {
      grass: matGrassBlock,
      stone: matStoneBlock,
      wood: matWoodBlock,
      bed: matBedBlock
    };

    // --- 通信と変数 ---
    const socket = io(window.location.origin, {
      transports: ["polling", "websocket"],
      reconnection: true
    });

    let myPlayer = null;
    let currentRoom = null;
    const otherPlayers = {};
    const worldBlocks = {};

    let selectedSlot = 1;
    let hp = 100;

    const lobbyScreen = document.getElementById("lobby-screen");
    const roomListDiv = document.getElementById("room-list");
    const roomInfo = document.getElementById("room-info");
    const gameStatus = document.getElementById("game-status");
    const connStatus = document.getElementById("conn-status");
    const heartsContainer = document.getElementById("hearts-container");

    function updateHearts() {
      heartsContainer.innerHTML = "";
      const fullHearts = Math.ceil(hp / 10);
      for (let i = 0; i < 10; i++) {
        const span = document.createElement("span");
        span.innerText = i < fullHearts ? "❤️" : "🖤";
        heartsContainer.appendChild(span);
      }
    }
    updateHearts();

    // 1〜4キーでスロット切り替え
    window.addEventListener("keydown", (e) => {
      if (["1", "2", "3", "4"].includes(e.key)) {
        selectedSlot = parseInt(e.key);
        document.querySelectorAll(".slot").forEach(s => {
          s.classList.toggle("active", s.getAttribute("data-slot") == selectedSlot);
        });
        updateArmWeapon();
      }
    });

    document.getElementById("btn-create-room").addEventListener("click", () => {
      if (!socket.connected) return alert("サーバーに接続されていません！");
      const name = document.getElementById("new-room-name").value.trim();
      const mode = document.getElementById("new-room-mode").value;
      socket.emit("createRoom", { name, mode });
    });

    document.getElementById("btn-leave").addEventListener("click", () => {
      document.exitPointerLock();
      socket.emit("leaveRoom");
      cleanupGameWorld();
      lobbyScreen.style.display = "flex";
    });

    socket.on("connect", () => {
      connStatus.innerText = "🟢 サーバーに接続完了！";
      socket.emit("getRooms");
    });

    socket.on("roomList", (rooms) => {
      roomListDiv.innerHTML = "";
      if (!rooms || rooms.length === 0) {
        roomListDiv.innerHTML = "<p style='color: #aaa;'>部屋がありません。新しく作成してください！</p>";
        return;
      }
      rooms.forEach(r => {
        const card = document.createElement("div");
        card.className = "room-card";
        card.innerHTML = `
          <div>
            <strong style="font-size: 16px;">${r.name}</strong>
            <div><span class="mode-tag mode-${r.mode}">${r.mode.toUpperCase()}</span></div>
            <div style="font-size: 13px; color: #ccc; margin: 8px 0;">参加者: ${r.playerCount}人</div>
          </div>
          <button onclick="joinRoom('${r.id}')">参加する</button>
        `;
        roomListDiv.appendChild(card);
      });
    });

    socket.on("roomCreated", (roomId) => joinRoom(roomId));

    socket.on("roomJoined", (data) => {
      currentRoom = data.roomInfo;
      myPlayer = data.myPlayer;

      lobbyScreen.style.display = "none";
      document.body.requestPointerLock();

      roomInfo.innerText = `[${currentRoom.mode.toUpperCase()}] ${currentRoom.name}`;
      gameStatus.innerText = currentRoom.mode === "skywars" ? "落ちたら奈落即死！中央島を目指せ！" :
                             currentRoom.mode === "bedwars" ? "相手のベッドブロックを破壊しろ！" : "自由建築モード";

      initMap(currentRoom.mode, data.blocks);

      for (const id in data.players) {
        if (id !== socket.id) addOtherPlayer(data.players[id]);
      }
    });

    socket.on("playerJoinedRoom", (player) => addOtherPlayer(player));
    socket.on("playerMoved", (pos) => {
      if (otherPlayers[pos.id]) {
        otherPlayers[pos.id].position.set(pos.x, pos.y, pos.z);
        otherPlayers[pos.id].rotation.y = pos.yaw;
      }
    });
    socket.on("playerLeftRoom", (id) => {
      if (otherPlayers[id]) {
        scene.remove(otherPlayers[id]);
        delete otherPlayers[id];
      }
    });

    socket.on("blockPlaced", (b) => addBlockMesh(b.x, b.y, b.z, b.type));
    socket.on("blockBroken", (pos) => removeBlockMesh(pos.x, pos.y, pos.z));

    socket.on("playerAction", (action) => {
      if (action.type === "hit" && action.targetId === socket.id) {
        takeDamage(action.damage);
      }
    });

    window.joinRoom = function(roomId) {
      const playerName = document.getElementById("player-name").value.trim() || "Steve";
      socket.emit("joinRoom", { roomId, playerName });
    };

    // --- Three.js グラフィックス初期化 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x78a7ff); // マイクラ風の青空
    scene.fog = new THREE.Fog(0x78a7ff, 35, 100);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 太陽光と環境光（影と陰影）
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(40, 70, 30);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));

    // --- 空に浮かぶ四角い雲 ---
    const clouds = [];
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
    for (let i = 0; i < 15; i++) {
      const w = 10 + Math.random() * 20;
      const d = 10 + Math.random() * 20;
      const cloud = new THREE.Mesh(new THREE.BoxGeometry(w, 2, d), cloudMat);
      cloud.position.set((Math.random() - 0.5) * 200, 45, (Math.random() - 0.5) * 200);
      scene.add(cloud);
      clouds.push(cloud);
    }

    // --- 1人称の手 ＆ 剣（右下に表示） ---
    const handGroup = new THREE.Group();
    // 腕（服＋肌）
    const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), new THREE.MeshLambertMaterial({ color: 0x00aaaa }));
    armMesh.position.set(0.35, -0.35, -0.5);
    armMesh.rotation.set(-0.2, 0.1, -0.2);
    handGroup.add(armMesh);

    // 剣（鉄の剣）
    const swordMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.05), new THREE.MeshLambertMaterial({ color: 0xdcdde1 }));
    swordMesh.position.set(0.35, -0.15, -0.6);
    swordMesh.rotation.set(0.6, 0.2, -0.3);
    handGroup.add(swordMesh);
    camera.add(handGroup);
    scene.add(camera);

    function updateArmWeapon() {
      swordMesh.visible = (selectedSlot === 1);
    }

    // --- ブロック管理 ---
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    function addBlockMesh(x, y, z, type = "grass") {
      const key = `${x},${y},${z}`;
      if (worldBlocks[key]) return;
      const mat = matByType[type] || matGrassBlock;
      const mesh = new THREE.Mesh(boxGeo, mat);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.userData = { x, y, z, type, isBed: type === "bed" };
      scene.add(mesh);
      worldBlocks[key] = mesh;
    }

    function removeBlockMesh(x, y, z) {
      const key = `${x},${y},${z}`;
      if (worldBlocks[key]) {
        scene.remove(worldBlocks[key]);
        delete worldBlocks[key];
      }
    }

    // 本格的な逆ピラミッド型の浮島を生成
    function createIsland(cx, cy, cz, radius) {
      for (let x = -radius; x <= radius; x++) {
        for (let z = -radius; z <= radius; z++) {
          const dist = Math.sqrt(x * x + z * z);
          if (dist <= radius) {
            // 表面: 草
            addBlockMesh(cx + x, cy, cz + z, "grass");
            // 中層: 土
            addBlockMesh(cx + x, cy - 1, cz + z, "dirt");

            // 下層: 中心に向かって尖る石の底
            const depth = Math.floor((radius - dist) * 1.5);
            for (let dy = 2; dy <= depth + 2; dy++) {
              addBlockMesh(cx + x, cy - dy, cz + z, "stone");
            }
          }
        }
      }
    }

    // 木を生やす
    function createTree(x, y, z) {
      for (let dy = 0; dy < 4; dy++) addBlockMesh(x, y + dy, z, "wood");
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          for (let dy = 2; dy <= 4; dy++) {
            if (dx !== 0 || dz !== 0 || dy === 4) addBlockMesh(x + dx, y + dy, z + dz, "grass");
          }
        }
      }
    }

    function initMap(mode, existingBlocks) {
      cleanupGameWorld();

      if (mode === "skywars") {
        // 中央島（巨大）
        createIsland(0, 10, 0, 6);
        createTree(0, 11, 0);

        // 4方向のプレイヤー浮島
        createIsland(25, 10, 0, 3);
        createIsland(-25, 10, 0, 3);
        createIsland(0, 10, 25, 3);
        createIsland(0, 10, -25, 3);
        camera.position.set(25, 12.6, 0);
      } else if (mode === "bedwars") {
        // 赤島・青島・中央エメラルド島
        createIsland(-20, 10, 0, 5); // 赤
        createIsland(20, 10, 0, 5);  // 青
        createIsland(0, 10, 0, 5);   // 中央

        addBlockMesh(-20, 11, 0, "bed"); // 赤ベッド
        addBlockMesh(20, 11, 0, "bed");  // 青ベッド
        camera.position.set(-20, 12.6, 0);
      } else {
        createIsland(0, 5, 0, 8);
        camera.position.set(0, 7.6, 6);
      }

      if (existingBlocks) {
        for (const key in existingBlocks) {
          const [bx, by, bz] = key.split(",").map(Number);
          addBlockMesh(bx, by, bz, existingBlocks[key]);
        }
      }
    }

    function cleanupGameWorld() {
      for (const key in worldBlocks) scene.remove(worldBlocks[key]);
      for (const id in otherPlayers) scene.remove(otherPlayers[id]);
      Object.keys(worldBlocks).length = 0;
      Object.keys(otherPlayers).length = 0;
    }

    // マイクラ風3Dプレイヤースキン（Steve風）
    function addOtherPlayer(p) {
      const group = new THREE.Group();
      // 体 (水色シャツ)
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshLambertMaterial({ color: 0x00aaaa }));
      body.position.y = 0.9;
      // 頭 (Steve肌色)
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xc68642 }));
      head.position.y = 1.55;
      // 髪の毛
      const hair = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.15, 0.52), new THREE.MeshLambertMaterial({ color: 0x4a2e18 }));
      hair.position.y = 1.75;
      // 足 (濃紺ズボン)
      const legs = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.6, 0.28), new THREE.MeshLambertMaterial({ color: 0x002266 }));
      legs.position.y = 0.3;

      group.add(body); group.add(head); group.add(hair); group.add(legs);
      group.position.set(p.x, p.y, p.z);
      scene.add(group);
      otherPlayers[p.id] = group;
    }

    // --- 操作・視点処理 ---
    let isLocked = false, pitch = 0, yaw = 0;
    let playerY = 12.6, velocityY = 0;
    const keys = {};
    let isSwinging = false, swingAngle = 0;

    document.addEventListener("click", () => {
      if (currentRoom && !isLocked) document.body.requestPointerLock();
    });
    document.addEventListener("pointerlockchange", () => {
      isLocked = document.pointerLockElement === document.body;
    });

    document.addEventListener("mousemove", (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;
      pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));
      camera.rotation.set(0, 0, 0);
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    window.addEventListener("keydown", (e) => keys[e.code] = true);
    window.addEventListener("keyup", (e) => keys[e.code] = false);

    // 左クリック（攻撃/破壊）、右クリック（設置）
    window.addEventListener("mousedown", (e) => {
      if (!isLocked) return;
      isSwinging = true; // 腕を振る

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      if (e.button === 0) {
        if (selectedSlot === 1) {
          // 剣攻撃
          for (const id in otherPlayers) {
            const hits = raycaster.intersectObjects(otherPlayers[id].children);
            if (hits.length > 0 && hits[0].distance < 4.0) {
              socket.emit("action", { type: "hit", targetId: id, damage: 25 });
              break;
            }
          }
        } else {
          // ブロック破壊
          const hits = raycaster.intersectObjects(Object.values(worldBlocks));
          if (hits.length > 0 && hits[0].distance < 5.5) {
            const target = hits[0].object.userData;
            removeBlockMesh(target.x, target.y, target.z);
            socket.emit("breakBlock", { x: target.x, y: target.y, z: target.z });
          }
        }
      }

      if (e.button === 2 && selectedSlot !== 1) {
        // ブロック設置
        const hits = raycaster.intersectObjects(Object.values(worldBlocks));
        if (hits.length > 0 && hits[0].distance < 5.5) {
          const hit = hits[0];
          const pos = hit.object.userData;
          const normal = hit.face.normal;
          const nx = pos.x + normal.x;
          const ny = pos.y + normal.y;
          const nz = pos.z + normal.z;
          const types = { 2: "grass", 3: "stone", 4: "wood" };
          const type = types[selectedSlot] || "grass";
          addBlockMesh(nx, ny, nz, type);
          socket.emit("placeBlock", { x: nx, y: ny, z: nz, color: type });
        }
      }
    });

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    function takeDamage(amount) {
      hp = Math.max(0, hp - amount);
      updateHearts();
      velocityY = 5; // ノックバック
      // 赤フラッシュ演出
      document.body.style.backgroundColor = "rgba(255,0,0,0.4)";
      setTimeout(() => document.body.style.backgroundColor = "#111", 100);

      if (hp <= 0) {
        alert("撃破されました！リスポーンします。");
        hp = 100;
        updateHearts();
        camera.position.set(0, 20, 0);
        velocityY = 0;
      }
    }

    // --- メインゲームループ ---
    let prevTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      // 雲をゆっくり流す
      clouds.forEach(c => {
        c.position.x += 1.5 * delta;
        if (c.position.x > 100) c.position.x = -100;
      });

      // 腕と剣のスイングアニメーション
      if (isSwinging) {
        swingAngle += delta * 20;
        handGroup.rotation.x = Math.sin(swingAngle) * 0.7;
        if (swingAngle >= Math.PI) {
          isSwinging = false;
          swingAngle = 0;
          handGroup.rotation.x = 0;
        }
      }

      if (isLocked && currentRoom) {
        const moveVec = new THREE.Vector3();
        if (keys["KeyW"]) moveVec.z -= 1;
        if (keys["KeyS"]) moveVec.z += 1;
        if (keys["KeyA"]) moveVec.x -= 1;
        if (keys["KeyD"]) moveVec.x += 1;
        moveVec.normalize();

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        camera.position.addScaledVector(forward, -moveVec.z * 8.5 * delta);
        camera.position.addScaledVector(right, moveVec.x * 8.5 * delta);

        velocityY -= 22 * delta;
        camera.position.y += velocityY * delta;

        // 接地判定
        const bKey = `${Math.floor(camera.position.x)},${Math.floor(camera.position.y - 1.6)},${Math.floor(camera.position.z)}`;
        if (worldBlocks[bKey] && velocityY < 0) {
          camera.position.y = Math.floor(camera.position.y - 1.6) + 2.5;
          velocityY = 0;
          if (keys["Space"]) velocityY = 8.0; // ジャンプ
        }

        // 奈落落下死
        if (camera.position.y < -15) {
          takeDamage(100);
        }

        if (socket.connected) {
          socket.emit("move", {
            x: camera.position.x,
            y: camera.position.y - 1.5,
            z: camera.position.z,
            yaw: yaw,
            pitch: pitch
          });
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
